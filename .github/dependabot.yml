version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # pnpm refuses versions published less than a day ago (minimumReleaseAge)
    cooldown:
      default-days: 1
    ignore:
      # Matches the Node runtime (.node-version, engines); raise it with the runtime
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # typescript-eslint supports TypeScript below 6.1; raise this when it supports newer
      - dependency-name: typescript
        versions: [">=6.1.0"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
