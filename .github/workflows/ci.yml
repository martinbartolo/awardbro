name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to dev or main gets its own run
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Lets the changes job list a pull request's files
  pull-requests: read

jobs:
  # Which parts of the repository changed, so each job below runs only when it can be affected.
  # On a push, compared with the commit before the push.
  changes:
    name: Find what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      database: ${{ steps.filter.outputs.database }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            # Anything that changes how every job installs and runs
            setup: &setup
              - .github/workflows/ci.yml
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - .node-version
            # Lint, types, format and unit tests: any code or config
            code:
              - *setup
              - "**/*.{ts,tsx,js,jsx,mjs,cjs,mdx,json}"
            # Migrations and integration tests: the schema and the API
            database:
              - *setup
              - prisma/**
              - prisma.config.ts
              - src/server/**
              - src/lib/**
              - src/test/**
              - src/env.js
              - vitest*.ts
            # End-to-end tests: anything the running app is built from
            app:
              - *setup
              - src/**
              - e2e/**
              - prisma/**
              - public/**
              - "*.config.{js,ts,cjs,mjs}"

  checks:
    name: Lint, types, format and tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # next typegen loads next.config.js, which validates env vars that CI doesn't have
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm test

  migrations:
    name: Migrations and integration tests
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    services:
      # Reused by the e2e job, which gets a container of its own
      postgres: &postgres
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: awardbro_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/awardbro_test
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/awardbro_test
      # The integration tests empty this database before each test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/awardbro_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply every migration to an empty database
        run: pnpm db:migrate
      - name: Check the result matches schema.prisma
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Integration tests
        run: pnpm test:integration

  e2e:
    name: End-to-end tests
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    services:
      postgres: *postgres
    env:
      # The tests build and start the app against this database (playwright.config.ts)
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/awardbro_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Lets `next build` reuse what it built for an earlier run
      - name: Cache the Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Upload the report and traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # The one check branch protection requires: it passes when every job above passed or was
  # skipped because nothing it covers changed. Add new jobs to `needs`.
  all-checks:
    name: All checks
    if: always()
    needs: [changes, checks, migrations, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
