# pnpm settings (pnpm 11+ no longer reads the "pnpm" field of package.json)

# Packages whose install scripts may run; any other package with one fails the install
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  sharp: true
  unrs-resolver: true

# Refuse versions published less than a day ago (pnpm's default, set here so the
# Dependabot cooldown in .github/dependabot.yml stays in step with it)
minimumReleaseAge: 1440

overrides:
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  # effect 3.20.0 has a ReDoS; @prisma/config pins it exactly. Remove with Prisma 8.
  "@prisma/config>effect": ^3.22.1
